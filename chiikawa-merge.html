<style>
  :root { --bg:#fdf3e4; --ink:#3b2b22; --accent:#f49ab0; --panel:#fffaf2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  #wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; border-radius:18px; box-shadow:0 8px 30px rgba(120,80,40,.18); background:var(--panel); }
  #over { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(60,40,30,.45); }
  #over .card { background:#fff; border-radius:22px; padding:28px 34px; text-align:center; border:4px solid var(--ink); max-width:86vw; }
  #over h2 { margin:0 0 8px; font-size:30px; }
  #over p { margin:4px 0 18px; font-size:20px; }
  button { font:inherit; font-size:20px; padding:10px 26px; border-radius:999px; border:3px solid var(--ink);
    background:var(--accent); color:#fff; cursor:pointer; text-shadow:0 1px 0 rgba(0,0,0,.25); }
  button:active { transform:translateY(2px); }
</style>

const META = [{"k": 1.191, "oy": 0.0}, {"k": 1.16, "oy": -0.006}, {"k": 1.142, "oy": -0.062}, {"k": 1.172, "oy": -0.001}, {"k": 1.035, "oy": -0.017}, {"k": 1.172, "oy": -0.001}, {"k": 1.251, "oy": 0.0}, {"k": 1.177, "oy": 0.0}, {"k": 1.116, "oy": -0.026}, {"k": 1.126, "oy": -0.021}];
// 0: 치이카와 … 9: 세이렌
const RADII = [16, 22, 29, 36, 44, 53, 63, 74, 87, 104];
const W = 440, H = 720;
const TOP = 130;            // container top (drop zone above)
const WALL = 14;
const BOX_L = WALL, BOX_R = W - WALL, BOX_B = H - 70;
const DANGER_Y = TOP + 18;
const DROP_Y = 82;

const { Engine, Bodies, Body, Composite, Events } = Matter;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min((innerWidth - 16) / W, (innerHeight - 16) / H);
  cvs.style.width = W * scale + 'px';
  cvs.style.height = H * scale + 'px';
  cvs.width = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

const images = IMGS.map(src => { const i = new Image(); i.src = src; return i; });

let engine, world, score, best, current, next, aimX, canDrop, gameOver, dangerTimer, effects, combo;
try { best = +localStorage.getItem('chiikawa-merge-best') || 0; } catch (e) { best = 0; }

function randTier() { return Math.floor(Math.random() * 5); }

function init() {
  engine = Engine.create();
  engine.gravity.y = 1.6;
  world = engine.world;
  const opt = { isStatic: true, friction: 0.5, restitution: 0.1 };
  Composite.add(world, [
    Bodies.rectangle(W / 2, BOX_B + 50, W + 200, 100, opt),
    Bodies.rectangle(BOX_L - 50, H / 2, 100, H * 3, opt),
    Bodies.rectangle(BOX_R + 50, H / 2, 100, H * 3, opt),
  ]);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);
  score = 0; current = randTier(); next = randTier(); aimX = W / 2;
  canDrop = true; gameOver = false; dangerTimer = 0; effects = []; combo = 0;
  document.getElementById('over').style.display = 'none';
}

function makeFace(tier, x, y) {
  const r = RADII[tier];
  const b = Bodies.circle(x, y, r, { restitution: 0.15, friction: 0.35, frictionStatic: 0.6, density: 0.0012 });
  b.tier = tier; b.born = performance.now(); b.pop = 0;
  Composite.add(world, b);
  return b;
}

function onCollide(e) {
  for (const p of e.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.tier === undefined || a.tier !== b.tier || a.merged || b.merged) continue;
    a.merged = b.merged = true;
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
    Composite.remove(world, a); Composite.remove(world, b);
    const t = a.tier;
    score += (t + 1) * (t + 2) / 2;
    if (t < RADII.length - 1) {
      const nb = makeFace(t + 1, x, y);
      nb.pop = 1;
      Body.setVelocity(nb, { x: 0, y: -1 });
      burst(x, y, RADII[t + 1], t + 1);
    } else {
      score += 200; // 세이렌 두 개를 합치면 보너스!
      burst(x, y, RADII[t] * 2, t);
      effects.push({ kind: 'text', x, y, text: '세이렌 보너스 +200', life: 1.6 });
    }
  }
}

const COLORS = ['#ffffff', '#7ea6c4', '#f5e3b5', '#bfe0f0', '#f5b5b5', '#a6765a', '#f2a07a', '#e8d6b0', '#a89a8a', '#f06a6a'];
function burst(x, y, r, tier) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
    effects.push({ kind: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.7,
      c: i % 2 ? '#ffd6e0' : COLORS[tier], size: 3 + Math.random() * 4 });
  }
  effects.push({ kind: 'ring', x, y, r: r * 0.6, life: 0.45 });
}

function drop() {
  if (!canDrop || gameOver) return;
  canDrop = false;
  const r = RADII[current];
  const x = Math.max(BOX_L + r, Math.min(BOX_R - r, aimX));
  makeFace(current, x, DROP_Y);
  current = next; next = randTier();
  setTimeout(() => { canDrop = true; }, 550);
}

function pointerX(ev) {
  const rect = cvs.getBoundingClientRect();
  return (ev.clientX - rect.left) / scale;
}
cvs.addEventListener('pointermove', ev => { aimX = pointerX(ev); });
cvs.addEventListener('pointerdown', ev => { aimX = pointerX(ev); cvs.setPointerCapture(ev.pointerId); });
cvs.addEventListener('pointerup', ev => { aimX = pointerX(ev); drop(); });
addEventListener('keydown', ev => {
  const r = RADII[current];
  if (ev.key === 'ArrowLeft') aimX = Math.max(BOX_L + r, Math.min(BOX_R - r, aimX) - 12);
  else if (ev.key === 'ArrowRight') aimX = Math.min(BOX_R - r, Math.max(BOX_L + r, aimX) + 12);
  else if (ev.key === ' ' || ev.key === 'ArrowDown') { ev.preventDefault(); drop(); }
});
document.getElementById('retry').onclick = () => { Composite.clear(world, false); Engine.clear(engine); init(); };

function endGame() {
  gameOver = true;
  if (score > best) { best = score; try { localStorage.setItem('chiikawa-merge-best', best); } catch (e) {} }
  document.getElementById('final').innerHTML = `점수 <b>${score}</b><br>최고 기록 ${best}`;
  document.getElementById('over').style.display = 'flex';
}

function drawFace(tier, x, y, angle, s = 1, alpha = 1) {
  const r = RADII[tier] * s, m = META[tier], D = 2 * r * m.k;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(angle);
  const img = images[tier];
  if (img.complete && img.naturalWidth) ctx.drawImage(img, -D / 2, -D / 2 + m.oy * D, D, D);
  else { ctx.fillStyle = COLORS[tier]; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!gameOver) {
    Engine.update(engine, dt * 1000);
    // game over check: settled face poking above the line
    let danger = false;
    for (const b of Composite.allBodies(world)) {
      if (b.tier === undefined) continue;
      if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 4);
      if (now - b.born > 1200 && b.position.y - RADII[b.tier] < DANGER_Y && b.speed < 1.5) danger = true;
    }
    dangerTimer = danger ? dangerTimer + dt : Math.max(0, dangerTimer - dt * 2);
    if (dangerTimer > 2.2) endGame();
  }

  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // background
  ctx.fillStyle = '#fffaf2'; ctx.fillRect(0, 0, W, H);
  // container
  ctx.fillStyle = '#fbe9d0';
  roundRect(BOX_L, TOP, BOX_R - BOX_L, BOX_B - TOP, 6); ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = '#3b2b22';
  ctx.beginPath(); ctx.moveTo(BOX_L - 2, TOP); ctx.lineTo(BOX_L - 2, BOX_B + 2); ctx.lineTo(BOX_R + 2, BOX_B + 2); ctx.lineTo(BOX_R + 2, TOP); ctx.stroke();
  // danger line
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = dangerTimer > 0 ? `rgba(230,60,70,${0.5 + 0.5 * Math.sin(now / 90)})` : 'rgba(230,90,100,.35)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(BOX_L, DANGER_Y); ctx.lineTo(BOX_R, DANGER_Y); ctx.stroke();
  ctx.restore();

  // HUD
  ctx.fillStyle = '#3b2b22'; ctx.textBaseline = 'top';
  ctx.font = '16px Jua, sans-serif'; ctx.fillText('점수', 18, 12);
  ctx.font = '34px Jua, sans-serif'; ctx.fillText(score, 18, 30);
  ctx.font = '14px Jua, sans-serif'; ctx.fillStyle = '#9a7f6c'; ctx.fillText('최고 ' + Math.max(best, score), 18, 68);
  ctx.textAlign = 'right'; ctx.fillStyle = '#3b2b22'; ctx.font = '16px Jua, sans-serif';
  ctx.fillText('다음', W - 22, 12);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fbe9d0'; ctx.beginPath(); ctx.arc(W - 40, 56, 22, 0, 7); ctx.fill();
  drawFace(next, W - 40, 56, 0, 18 / RADII[next]);

  // aim guide + current piece
  if (!gameOver) {
    const r = RADII[current];
    const x = Math.max(BOX_L + r, Math.min(BOX_R - r, aimX));
    ctx.strokeStyle = 'rgba(59,43,34,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(x, DROP_Y + r); ctx.lineTo(x, BOX_B); ctx.stroke(); ctx.setLineDash([]);
    drawFace(current, x, DROP_Y, 0, 1, canDrop ? 1 : 0.35);
  }

  // faces
  for (const b of Composite.allBodies(world)) {
    if (b.tier === undefined) continue;
    const s = 1 + 0.18 * Math.sin(b.pop * Math.PI) ;
    drawFace(b.tier, b.position.x, b.position.y, b.angle, b.pop > 0 ? (1 - b.pop * 0.3) * s : 1);
  }

  // effects
  for (const f of effects) {
    f.life -= dt;
    if (f.kind === 'dot') {
      f.x += f.vx; f.y += f.vy; f.vy += 0.15;
      ctx.globalAlpha = Math.max(0, f.life / 0.7); ctx.fillStyle = f.c;
      ctx.strokeStyle = '#3b2b22'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, 7); ctx.fill(); ctx.stroke();
    } else if (f.kind === 'ring') {
      const p = 1 - f.life / 0.45;
      ctx.globalAlpha = Math.max(0, 1 - p); ctx.strokeStyle = '#f49ab0'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + p * 0.9), 0, 7); ctx.stroke();
    } else if (f.kind === 'text') {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life)); ctx.fillStyle = '#e04a6a';
      ctx.font = '26px Jua, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y - (1.6 - f.life) * 40); ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;
  }
  effects = effects.filter(f => f.life > 0);

  // evolution chain
  const cy = BOX_B + 36, step = (W - 40) / RADII.length;
  for (let i = 0; i < RADII.length; i++) {
    const cx = 20 + step * (i + 0.5);
    drawFace(i, cx, cy, 0, (8 + i * 1.3) / RADII[i]);
    if (i < RADII.length - 1) {
      ctx.fillStyle = '#c9ab92'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('›', cx + step / 2, cy); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    }
  }

  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);
</script>
</body>
</html>
